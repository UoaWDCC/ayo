name: Checks and deploy
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check app
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-build-placeholder-not-used-for-deployment
      DATABASE_URL: mongodb://127.0.0.1:27017/ayo_ci
      S3_BUCKET: ayo-ci-unused
      S3_REGION: auto
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  deploy:
    name: Deploy app
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
